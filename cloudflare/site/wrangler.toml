name = "bioai-rizhi"
main = "index.js"
compatibility_date = "2026-10-08"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = false

[assets]
directory = "../../dist"
binding = "ASSETS"
run_worker_first = ["/", "/api/*", "/mcp", "/health", "/feed.xml", "/digest/*", "/topics/*", "/companies/*", "/records/*", "/events/*", "/sitemap.xml", "/robots.txt", "/llms.txt", "/connect", "/internal/*"]

[triggers]
# Hourly acquisition at minute 7 UTC (also minute 7 in Beijing).
# Daily digest at 00:00 UTC = 08:00 Asia/Shanghai.
crons = ["7 * * * *", "0 0 * * *"]

[[queues.producers]]
binding = "INGEST_QUEUE"
queue = "bioai-ingestion"

[[queues.consumers]]
queue = "bioai-ingestion"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 5
max_concurrency = 1
retry_delay = 60

[[ratelimits]]
name = "MCP_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "API_RATE_LIMITER"
namespace_id = "1002"
simple = { limit = 120, period = 60 }

[observability]
enabled = true
head_sampling_rate = 1

# DATABASE_URL and ADMIN_TOKEN are deployed as Worker secrets.
# Set SITE_ORIGIN after Cloudflare returns the actual workers.dev hostname.

[vars]
SITE_ORIGIN = "https://bioai-rizhi.328558608.workers.dev"
GITHUB_URL = "https://github.com/MInsYang/bioai-rizhi"
