# Supply secrets via deploy/.env (ignored), not the repository root local-test .env.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: bioai
      POSTGRES_DB: bioai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a URL-safe random password}
    volumes:
      - bioai-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bioai -d bioai"]
      interval: 5s
      timeout: 5s
      retries: 20
  migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment: &app-env
      DATABASE_URL: postgresql://bioai:${POSTGRES_PASSWORD}@db:5432/bioai
      ADMIN_TOKEN: ${ADMIN_TOKEN:?Set admin secret}
      INGEST_SECRET: ${INGEST_SECRET:?Set dispatch secret}
    command: ["sh", "-c", "python -m backend.migrate && python -m backend.seed"]
    depends_on:
      db:
        condition: service_healthy
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment: *app-env
    ports: ["127.0.0.1:8000:8000"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
  consumer:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment: *app-env
    command: ["python", "-m", "backend.worker"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  bioai-postgres:
