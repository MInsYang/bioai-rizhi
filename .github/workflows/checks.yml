name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: bioai
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: bioai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bioai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://bioai:local-ci-only@127.0.0.1:5432/bioai
      API_TEST_DATABASE_URL: postgresql://bioai:local-ci-only@127.0.0.1:5432/bioai
      BIOAI_TEST_LOCAL: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: cloudflare/site/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements.lock
      - run: npm ci --prefix cloudflare/site
      - run: python -m pytest backend/tests -q
      - run: node tests/test_ui.cjs
      - run: npm test --prefix cloudflare/site
      - run: npm run check --prefix cloudflare/site
